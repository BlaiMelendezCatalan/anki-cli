[project]
name = "anki-cli"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anki>=25.9.2",
    "click>=8.3.1",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
style = [
    "pre-commit>=4.5.1",
]
tests = [
    "pytest>=9.0.2",
]

[project.scripts]
anki = "src.anki_cli.main:entry_point"